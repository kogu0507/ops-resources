name: GAS Dev Deploy

on:
  push:
    branches:
      - main
    paths:
      - "ai-automation/gas-drive-state/src/**"
      - "ai-automation/gas-drive-state/scripts/**"
      - "ai-automation/gas-drive-state/package.json"
      - "ai-automation/gas-drive-state/package-lock.json"
      - ".github/workflows/gas-dev-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-drive-state-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    environment: development
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-automation/gas-drive-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install clasp
        run: npm install --no-audit --no-fund
      - name: Validate required development environment configuration
        env:
          CLASPRC_JSON_DEV: ${{ secrets.CLASPRC_JSON_DEV }}
          CLASP_JSON_DEV: ${{ secrets.CLASP_JSON_DEV }}
          EXPECTED_DEV_SCRIPT_ID: ${{ vars.EXPECTED_DEV_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON_DEV" || (echo "CLASPRC_JSON_DEV missing" && exit 1)
          test -n "$CLASP_JSON_DEV" || (echo "CLASP_JSON_DEV missing" && exit 1)
          test -n "$EXPECTED_DEV_SCRIPT_ID" || (echo "EXPECTED_DEV_SCRIPT_ID missing" && exit 1)
      - name: Materialize development-only clasp credential and project mapping
        env:
          CLASPRC_JSON_DEV: ${{ secrets.CLASPRC_JSON_DEV }}
          CLASP_JSON_DEV: ${{ secrets.CLASP_JSON_DEV }}
        run: |
          printf '%s' "$CLASPRC_JSON_DEV" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON_DEV" > .clasp.dev.json
          chmod 600 "$HOME/.clasprc.json" .clasp.dev.json
      - name: Exact target and push allowlist preflight
        env:
          EXPECTED_SCRIPT_ID: ${{ vars.EXPECTED_DEV_SCRIPT_ID }}
          EXPECTED_ROOT_DIR: src
        run: node scripts/validate-deploy-target.mjs .clasp.dev.json
      - name: Inspect clasp status after independent target verification
        run: npx clasp status --project .clasp.dev.json
      - name: Push source to exact Dev target
        run: npx clasp push --force --project .clasp.dev.json
      - name: Prepare isolated Dev readback workspace
        run: node scripts/prepare-drift-project.mjs .clasp.dev.json .gas-drift/pulled
      - name: Pull exact Dev target after push
        run: |
          (cd .gas-drift/pulled && ../../node_modules/.bin/clasp pull)
          rm -f .gas-drift/pulled/.clasp.json
      - name: Verify GitHub source matches Dev GAS readback
        run: |
          echo "working-directory=$PWD"
          find .gas-drift/pulled -maxdepth 1 -type f -print | sort
          node scripts/compare-gas-source.mjs "$PWD/src" "$PWD/.gas-drift/pulled"
      - name: Remove temporary credential and readback files
        if: always()
        run: rm -rf "$HOME/.clasprc.json" .clasp.dev.json .gas-drift

name: GAS Dev Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-drive-state-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-automation/gas-drive-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --no-audit --no-fund

      - name: Validate required secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_DEV: ${{ secrets.CLASP_JSON_DEV }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "CLASPRC_JSON missing" && exit 1)
          test -n "$CLASP_JSON_DEV" || (echo "CLASP_JSON_DEV missing" && exit 1)

      - name: Materialize clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_DEV: ${{ secrets.CLASP_JSON_DEV }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON_DEV" > .clasp.dev.json
          chmod 600 "$HOME/.clasprc.json" .clasp.dev.json

      - name: Inspect target mapping
        run: npx clasp status --project .clasp.dev.json

      - name: Push source to Dev
        run: npx clasp push --force --project .clasp.dev.json

      - name: Remove temporary credential files
        if: always()
        run: |
          rm -f "$HOME/.clasprc.json" .clasp.dev.json

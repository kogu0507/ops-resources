name: TEMP Production Source Materialization Once

on:
  push:
    branches:
      - ai-auto-gas-prod-source-once-20260922
    paths:
      - .github/workflows/temp-prod-source-once.yml

permissions:
  contents: read

concurrency:
  group: gas-drive-state-prod-source-once
  cancel-in-progress: false

jobs:
  materialize-prod-source-once:
    environment: development
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-automation/gas-drive-state
    steps:
      - name: Checkout exact reviewed main source
        uses: actions/checkout@v4
        with:
          ref: 6f9802d463b52482bc49cadf429760dfd6b12696

      - name: Verify exact reviewed Git ref
        run: |
          test "$(git rev-parse HEAD)" = "6f9802d463b52482bc49cadf429760dfd6b12696" || (echo "GIT_REF_MISMATCH" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --no-audit --no-fund

      - name: Validate authorized reused credential is present
        env:
          CLASPRC_JSON_DEV: ${{ secrets.CLASPRC_JSON_DEV }}
        run: |
          test -n "$CLASPRC_JSON_DEV" || (echo "CLASPRC_JSON_DEV missing" && exit 1)

      - name: Materialize temporary credential and exact Production mapping
        env:
          CLASPRC_JSON_DEV: ${{ secrets.CLASPRC_JSON_DEV }}
        run: |
          printf '%s' "$CLASPRC_JSON_DEV" > "$HOME/.clasprc.json"
          printf '%s\n' '{"scriptId":"1r3y9O0_Du-QAoxKiJRP5nCSnLzrMo5IFTV3m1ex2KsvQCFNR5d0qoLBL","rootDir":"src"}' > .clasp.prod.once.json
          chmod 600 "$HOME/.clasprc.json" .clasp.prod.once.json

      - name: Exact Production target and push allowlist preflight
        env:
          EXPECTED_SCRIPT_ID: 1r3y9O0_Du-QAoxKiJRP5nCSnLzrMo5IFTV3m1ex2KsvQCFNR5d0qoLBL
          EXPECTED_ROOT_DIR: src
        run: node scripts/validate-deploy-target.mjs .clasp.prod.once.json

      - name: Inspect clasp status after independent Production target verification
        run: npx clasp status --project .clasp.prod.once.json

      - name: Push source to exact Production target
        run: npx clasp push --force --project .clasp.prod.once.json

      - name: Prepare isolated Production readback workspace
        run: node scripts/prepare-drift-project.mjs .clasp.prod.once.json .gas-drift/pulled

      - name: Pull exact Production target after push
        run: |
          (cd .gas-drift/pulled && ../../node_modules/.bin/clasp pull)
          rm -f .gas-drift/pulled/.clasp.json

      - name: Verify GitHub source matches Production GAS readback
        run: |
          echo "approved_git_sha=$(git rev-parse HEAD)"
          echo "working-directory=$PWD"
          find .gas-drift/pulled -maxdepth 1 -type f -print | sort
          node scripts/compare-gas-source.mjs "$PWD/src" "$PWD/.gas-drift/pulled"

      - name: Remove temporary credential, mapping and readback files
        if: always()
        run: rm -rf "$HOME/.clasprc.json" .clasp.prod.once.json .gas-drift
